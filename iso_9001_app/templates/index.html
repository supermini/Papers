<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Conformities</title>
</head>
<body>
    <h1>Non-Conformities</h1>
    <a href="/add">Add Non-Conformity</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Description</th>
                <th>Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for nc in non_conformities %}
            <tr>
                <td>{{ nc.id }}</td>
                <td>{{ nc.description }}</td>
                <td>{{ nc.date.strftime('%Y-%m-%d') }}</td>
                <td>{{ nc.status }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
